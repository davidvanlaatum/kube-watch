name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Validate release tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must match vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Validate release commit
        run: |
          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "Release tag must point to the exact current main commit" >&2
            echo "tag:  $GITHUB_SHA" >&2
            echo "main: $main_sha" >&2
            exit 1
          fi

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run Go tests
        run: go test -race ./...

      - name: Type-check web
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests
        run: npm run test:unit:coverage
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Build Go binary
        run: go build -o kube-watch .

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
