name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GO_COVERAGE_MINIMUM: "80"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Measure Go coverage and comment on pull request
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: gwatts/go-coverage-action@v2
        id: coverage
        with:
          coverage-threshold: ${{ env.GO_COVERAGE_MINIMUM }}
          cover-mode: atomic
          cover-pkg: ./...
          test-args: '["-v", "-race"]'
          notes-ref: gocoverage-stable

      # Fork and Dependabot PR tokens cannot push the coverage action's Git notes.
      - name: Measure Go coverage without repository writes
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        shell: bash
        run: |
          go test -v -race -covermode=atomic -coverprofile="$RUNNER_TEMP/go.cov" -coverpkg=./... ./...
          go tool cover -func="$RUNNER_TEMP/go.cov" | tee "$RUNNER_TEMP/go-coverage.txt"
          awk -v minimum="$GO_COVERAGE_MINIMUM" '/^total:/ { found = 1; coverage = $3; sub(/%$/, "", coverage); print "Go coverage: " coverage "% (minimum " minimum "%)"; if (coverage + 0 < minimum) exit 1 } END { if (!found) exit 1 }' "$RUNNER_TEMP/go-coverage.txt"

      - name: Type-check web
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests
        run: npm run test:unit:coverage
        working-directory: web

      - name: Report frontend coverage on pull request
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          hashFiles('web/coverage/coverage-summary.json') != '' &&
          hashFiles('web/coverage/coverage-final.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: web
          name: Frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web

      - name: Build Go binary
        run: go build -o kube-watch .

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_SECRET }}
          gistID: b4f56efa2428740a17cdf241c5c700c1
          filename: coverage.json
          label: Go Coverage
          message: ${{ steps.coverage.outputs.coverage-pct-1dp }}%
          color: ${{ steps.coverage.outputs.meets-threshold == 'true' && 'green' || 'red' }}

      - name: Update frontend coverage badge
        if: github.ref == 'refs/heads/main'
        uses: gaelgirodon/ci-badges-action@v1
        with:
          gist-id: b4f56efa2428740a17cdf241c5c700c1
          token: ${{ secrets.COVERAGE_GIST_SECRET }}
          prefix: kube-watch
